name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      terminal-progress--release_created: ${{ steps.release.outputs['packages/terminal-progress--release_created'] }}
      homeassistant--release_created: ${{ steps.release.outputs['packages/homeassistant--release_created'] }}
      forge-session-title--release_created: ${{ steps.release.outputs['packages/forge-session-title--release_created'] }}
      atuin-history--release_created: ${{ steps.release.outputs['packages/atuin-history--release_created'] }}
      tmux-indicator--release_created: ${{ steps.release.outputs['packages/tmux-indicator--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release

  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    strategy:
      matrix:
        include:
          - package: terminal-progress
            enabled: ${{ needs.release-please.outputs['terminal-progress--release_created'] }}
          - package: homeassistant
            enabled: ${{ needs.release-please.outputs['homeassistant--release_created'] }}
          - package: forge-session-title
            enabled: ${{ needs.release-please.outputs['forge-session-title--release_created'] }}
          - package: atuin-history
            enabled: ${{ needs.release-please.outputs['atuin-history--release_created'] }}
          - package: tmux-indicator
            enabled: ${{ needs.release-please.outputs['tmux-indicator--release_created'] }}
    steps:
      - if: matrix.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - if: matrix.enabled == 'true'
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - if: matrix.enabled == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - if: matrix.enabled == 'true'
        name: Install dependencies
        run: mise run setup

      - if: matrix.enabled == 'true'
        name: Build
        run: |
          pkg="packages/${{ matrix.package }}"
          bun build "$pkg/src/index.ts" --outdir "$pkg/dist" --target bun

      - if: matrix.enabled == 'true'
        name: Publish
        run: npm publish --access public --tag latest
        working-directory: packages/${{ matrix.package }}

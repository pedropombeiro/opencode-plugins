name: Release

'on':
  push:
    branches:
      - main
      - v1

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      terminal-progress--release_created: ${{ steps.release.outputs['packages/terminal-progress--release_created'] }}
      homeassistant--release_created: ${{ steps.release.outputs['packages/homeassistant--release_created'] }}
      forgekeeper--release_created: ${{ steps.release.outputs['packages/forgekeeper--release_created'] }}
      atuin-history--release_created: ${{ steps.release.outputs['packages/atuin-history--release_created'] }}
      tmux-indicator--release_created: ${{ steps.release.outputs['packages/tmux-indicator--release_created'] }}
      session-finder--release_created: ${{ steps.release.outputs['packages/session-finder--release_created'] }}
      cache-coach--release_created: ${{ steps.release.outputs['packages/cache-coach--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}

  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    strategy:
      matrix:
        include:
          - package: terminal-progress
            enabled: ${{ needs.release-please.outputs['terminal-progress--release_created'] }}
          - package: homeassistant
            enabled: ${{ needs.release-please.outputs['homeassistant--release_created'] }}
          - package: forgekeeper
            enabled: ${{ needs.release-please.outputs['forgekeeper--release_created'] }}
          - package: atuin-history
            enabled: ${{ needs.release-please.outputs['atuin-history--release_created'] }}
          - package: tmux-indicator
            enabled: ${{ needs.release-please.outputs['tmux-indicator--release_created'] }}
          - package: session-finder
            enabled: ${{ needs.release-please.outputs['session-finder--release_created'] }}
          - package: cache-coach
            enabled: ${{ needs.release-please.outputs['cache-coach--release_created'] }}
    steps:
      - if: matrix.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.enabled == 'true'
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - if: matrix.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - if: matrix.enabled == 'true'
        name: Install dependencies
        run: mise run setup

      - if: matrix.enabled == 'true'
        name: Build
        run: mise run build ${{ matrix.package }}

      - if: matrix.enabled == 'true'
        name: Stage
        run: npm stage publish --access public --provenance --tag ${{ github.ref_name == 'main' && 'latest' || 'opencode-v1' }}
        working-directory: packages/${{ matrix.package }}

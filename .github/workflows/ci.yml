name: CI

'on':
  pull_request:
    branches:
      - main
      - v1
  push:
    branches:
      - main
      - v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install dependencies
        run: mise run setup

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test --coverage

      - name: Collect base branch coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add --detach "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          if [ ! -f "$RUNNER_TEMP/base/bunfig.toml" ]; then
            cp bunfig.toml "$RUNNER_TEMP/base/bunfig.toml"
          fi
          cd "$RUNNER_TEMP/base"
          mise run setup
          bun test --coverage --coverage-reporter=lcov --coverage-dir="$RUNNER_TEMP/base-coverage"

      - name: Check test coverage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun .mise/coverage.ts coverage/lcov.info "$RUNNER_TEMP/base-coverage/lcov.info"
          else
            bun .mise/coverage.ts coverage/lcov.info
          fi

      - name: Build
        run: mise run build

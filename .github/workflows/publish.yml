name: Publish

on:
  workflow_call:
    inputs:
      package-path:
        description: Path to the package directory (e.g. packages/terminal-progress)
        type: string
        required: true
      tag:
        description: npm dist-tag to publish under
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      package-path:
        description: Path to the package directory (e.g. packages/terminal-progress)
        type: string
        required: true
      tag:
        description: npm dist-tag to publish under
        type: string
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: mise run setup

      - name: Build
        run: mise run build "$(basename "${{ inputs.package-path }}")"

      - name: Stage
        run: npm stage publish --access public --provenance --tag ${{ inputs.tag }}
        working-directory: ${{ inputs.package-path }}
